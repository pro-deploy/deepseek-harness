# Test-only agent and persistence patch over the shipped base + headless
# profile. The shared driver owns the turn, so the product runner stays off.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      krokki-official:
        reasoning: max
        models:
          - id: deepseek-v4-pro
            name: deepseek-v4-pro
            contextWindow: 128000
          - id: deepseek-v4-flash
            name: deepseek-v4-flash
            contextWindow: 128000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: krokki-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
