# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      krokki-official:
        baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
        reasoning: low
        streamIdleTimeoutMs: 150

- id: agent-loop
  config:
    agents:
      - id: main
        provider: krokki-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
