# Missing-credential patch over the shipped headless profile. The replacement
# adapter registers the production route but cannot reach its endpoint.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: krokki-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: llm-pi-ai-keyless
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          krokki-official:
            displayName: KROKKI
            apiKeyEnv: KROKKI_API_KEY
            api: openai-completions
            baseURL: 'http://127.0.0.1:9'
            models:
              - id: deepseek-v4-flash
                name: deepseek-v4-flash
                contextWindow: 262144
